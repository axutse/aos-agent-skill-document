name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Scan public release
        run: python scripts/check_public_release.py --root .
      - name: Run tests
        run: pytest
      - name: Build and render TAIZHOU example
        run: |
          python examples/taizhou-white-paper/build_release.py \
            --output-dir "$RUNNER_TEMP/output" \
            --qa-dir "$RUNNER_TEMP/qa" \
            --dpi 96
          test "$(find "$RUNNER_TEMP/qa/pdf-render" -name 'page-*.png' | wc -l)" -eq 20
